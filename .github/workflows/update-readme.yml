name: Auto Update README

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: readme-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-update README with retry & rebase
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          for i in {1..5}; do
            echo "Attempt $i to update and push README..."
            git pull --rebase origin main
            python3 .github/scripts/generate_readme.py
            git add README.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: auto-update README.md [skip ci]"
              if git push origin main; then
                echo "Successfully updated and pushed README.md!"
                exit 0
              fi
            else
              echo "No changes to README.md."
              exit 0
            fi
            sleep 2
          done
          echo "Failed to push README.md after 5 attempts."
          exit 1
